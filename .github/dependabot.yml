# Keep action versions in workflows up-to-date. Direct action pins
# (actions/checkout, softprops/action-gh-release, ludeeus/action-shellcheck)
# get weekly bump PRs grouped into a single PR.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
