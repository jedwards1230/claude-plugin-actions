# Reusable workflow: validates Claude Code plugin marketplace version bumps and
# marketplace.json hygiene, and posts a PR comment summarizing plugin changes.
#
# Consumed by Claude Code plugin marketplaces (single-plugin or multi-plugin
# repos) so the check logic and bundled script live in one place rather than
# being duplicated per repo.
#
# Caller pins a ref (e.g. @v0) and this workflow self-checks-out the exact
# commit SHA of THIS workflow file (via github.job_workflow_sha) so the
# workflow YAML and the bundled script never drift.
name: Plugin Version Check

on:
  workflow_call:
    inputs:
      marketplace-path:
        description: "Path to marketplace.json relative to repo root"
        required: false
        type: string
        default: ".claude-plugin/marketplace.json"
      plugins-dir:
        description: "Directory containing plugin subdirectories (matches marketplace.json metadata.pluginRoot)"
        required: false
        type: string
        default: "plugins"
      base-ref:
        description: "Git ref to compare against. Defaults to the PR base SHA on pull_request events, or HEAD~1 on push events."
        required: false
        type: string
        default: ""
      post-pr-comment:
        description: "Post a PR comment summarizing added/removed/updated plugins"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: "Plugin Version Check — ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consuming repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout claude-plugin-actions scripts
        # github.job_workflow_sha is the exact commit SHA of THIS reusable
        # workflow file. github.workflow_ref points at the CALLER's workflow,
        # so we can't use it to self-checkout. SHA pinning also guarantees
        # bit-for-bit consistency between the workflow YAML and the script.
        uses: actions/checkout@v7
        with:
          repository: jedwards1230/claude-plugin-actions
          ref: ${{ github.job_workflow_sha }}
          path: .claude-plugin-actions
          fetch-depth: 1

      - name: Resolve base ref
        id: base
        env:
          INPUT_BASE_REF: ${{ inputs.base-ref }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$INPUT_BASE_REF" ]]; then
            BASE="$INPUT_BASE_REF"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="HEAD~1"
          fi
          echo "ref=${BASE}" >> "$GITHUB_OUTPUT"
          echo "Comparing HEAD against ${BASE}"

      - name: Check plugin versions
        env:
          MARKETPLACE_PATH: ${{ inputs.marketplace-path }}
          PLUGINS_DIR: ${{ inputs.plugins-dir }}
        run: |
          bash .claude-plugin-actions/scripts/check-plugin-versions.sh "${{ steps.base.outputs.ref }}"

      - name: Detect plugin changes for PR comment
        if: always() && github.event_name == 'pull_request' && inputs.post-pr-comment
        id: changes
        env:
          MARKETPLACE: ${{ inputs.marketplace-path }}
          PLUGINS_DIR: ${{ inputs.plugins-dir }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          OLD_NAMES=$(git show "$BASE:$MARKETPLACE" 2>/dev/null | jq -r '.plugins[]?.name' | sort -u || true)
          NEW_NAMES=$(git show "$HEAD:$MARKETPLACE" 2>/dev/null | jq -r '.plugins[]?.name' | sort -u || true)

          ADDED=$(comm -13 <(echo "$OLD_NAMES") <(echo "$NEW_NAMES") || true)
          REMOVED=$(comm -23 <(echo "$OLD_NAMES") <(echo "$NEW_NAMES") || true)
          COMMON=$(comm -12 <(echo "$OLD_NAMES") <(echo "$NEW_NAMES") || true)

          plugin_version() {
            local name="$1" ref="$2"
            git show "${ref}:${PLUGINS_DIR}/${name}/.claude-plugin/plugin.json" 2>/dev/null \
              | jq -r '.version // "unknown"' 2>/dev/null || echo "unknown"
          }

          SUMMARY=""
          HAS_CHANGES="false"

          if [ -n "$ADDED" ]; then
            HAS_CHANGES="true"
            SUMMARY+="### ➕ Added Plugins\n\n"
            SUMMARY+="| Plugin | Version |\n|---|---|\n"
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              ver=$(plugin_version "$name" "$HEAD")
              SUMMARY+="| \`$name\` | \`$ver\` |\n"
            done <<< "$ADDED"
            SUMMARY+="\n"
          fi

          if [ -n "$REMOVED" ]; then
            HAS_CHANGES="true"
            SUMMARY+="### ➖ Removed Plugins\n\n"
            SUMMARY+="| Plugin | Last Version |\n|---|---|\n"
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              ver=$(plugin_version "$name" "$BASE")
              SUMMARY+="| \`$name\` | \`$ver\` |\n"
            done <<< "$REMOVED"
            SUMMARY+="\n"
          fi

          UPDATED=""
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            old_ver=$(plugin_version "$name" "$BASE")
            new_ver=$(plugin_version "$name" "$HEAD")
            if [ "$old_ver" != "$new_ver" ]; then
              UPDATED+="| \`$name\` | \`$old_ver\` → \`$new_ver\` |\n"
            fi
          done <<< "$COMMON"

          if [ -n "$UPDATED" ]; then
            HAS_CHANGES="true"
            SUMMARY+="### 🔄 Updated Plugins\n\n"
            SUMMARY+="| Plugin | Version Change |\n|---|---|\n"
            SUMMARY+="$UPDATED\n"
          fi

          OLD_META=$(git show "$BASE:$MARKETPLACE" 2>/dev/null | jq -r '.metadata.version // "unknown"' || echo "unknown")
          NEW_META=$(git show "$HEAD:$MARKETPLACE" 2>/dev/null | jq -r '.metadata.version // "unknown"')
          if [ "$OLD_META" != "$NEW_META" ]; then
            HAS_CHANGES="true"
            SUMMARY+="### 📦 Marketplace Version\n\n"
            SUMMARY+="\`$OLD_META\` → \`$NEW_META\`\n"
          fi

          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<SUMMARY_EOF"
            printf "$SUMMARY"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request' && inputs.post-pr-comment && steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.changes.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Delete previous bot comments to avoid duplicates on synchronize
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("Plugin Changes Summary")) | .id' \
            | while read -r id; do
                gh api -X DELETE "repos/${REPO}/issues/comments/$id"
              done

          {
            echo "## 🔌 Plugin Changes Summary"
            echo ""
            printf '%s' "$SUMMARY"
            echo ""
            echo "---"
            echo "> Generated by [check-plugin-versions](${RUN_URL}) workflow."
          } | gh pr comment "$PR_NUMBER" --body-file -
